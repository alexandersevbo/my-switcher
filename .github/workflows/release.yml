name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build -c Release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/Release/net48/MySwitcher.exe \
            --title "my-switcher $GITHUB_REF_NAME" \
            --notes "Скачайте MySwitcher.exe, запустите и ответьте «Да» на вопрос об установке. Подробности — в README."
